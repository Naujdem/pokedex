<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pokédex Taxonómica</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#14241c">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Source+Serif+4:ital,wght@0,400;1,400;1,600&display=swap" rel="stylesheet">
<style>
:root{--bg:#e9efe9;--panel:#f8fbf8;--ink:#14241c;--mut:#5c6e63;--line:#c5d3c9;--acc:#c8372d;--acc-ink:#fff;--soft:#dbe7de;
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1a14;--panel:#17261e;--ink:#e6f0e9;--mut:#93a89b;--line:#2b4034;--soft:#20362a}}
:root[data-theme="dark"]{--bg:#0f1a14;--panel:#17261e;--ink:#e6f0e9;--mut:#93a89b;--line:#2b4034;--soft:#20362a}
*,*:before,*:after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Source Serif 4",Georgia,serif}
h1,h2,h3,.sans,button,label,input,select,textarea{font-family:"Bricolage Grotesque",system-ui,sans-serif}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 20px;border-bottom:1px solid var(--line)}
h1{font-size:1.25rem;margin:0;display:flex;align-items:center;gap:10px}
.lens{width:18px;height:18px;border-radius:50%;background:var(--acc);box-shadow:0 0 0 3px var(--panel),0 0 0 4px var(--line)}
button{cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:8px 14px;border-radius:8px;font-size:.9rem}
button.primary{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.card:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.app{display:grid;grid-template-columns:180px minmax(0,1fr) 320px;min-height:calc(100vh - 62px)}
.steps{border-right:1px solid var(--line);display:flex;flex-direction:column}
.step{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:6px;border:0;border-bottom:1px solid var(--line);border-radius:0;background:transparent;padding:10px 6px;text-align:center}
.step:disabled{cursor:default;opacity:.55}
.step .lv{font-size:.8rem;color:var(--mut)}
.step .val{font-weight:700;font-size:.95rem;overflow-wrap:anywhere}
.step{border-left:5px solid var(--c)}.step.on{background:var(--soft)}
main{padding:20px;min-width:0}
.crumb{color:var(--mut);margin:0 0 14px;font-size:.95rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.card{border:1px solid var(--line);background:var(--panel);border-radius:10px;overflow:hidden;cursor:pointer;text-align:left;padding:0;display:block;width:100%;color:inherit}
.card:hover{border-color:var(--acc)}
.card.sel{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc)}
.ph{aspect-ratio:1/1;background:var(--soft);display:grid;place-items:center;font-size:2.6rem}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.cap{padding:10px 12px}
.cap b{display:block;font-family:"Bricolage Grotesque",system-ui,sans-serif;font-size:1rem}
.cap i{color:var(--mut);font-size:.88rem}
.cap small{color:var(--mut);font-size:.8rem}
aside{border-left:1px solid var(--line);padding:20px;background:var(--panel)}
aside .ph{border-radius:10px;overflow:hidden;font-size:4rem;border:1px solid var(--line)}
aside h2{margin:14px 0 0;font-size:1.4rem}
aside .sci{font-style:italic;font-size:1.1rem;color:var(--mut);margin:0 0 12px}
.lin{font-size:.88rem;color:var(--mut);margin:0 0 14px;padding:0;list-style:none}.lin li{border-left:4px solid var(--c);padding:1px 0 1px 8px;margin-bottom:2px}.lin li span{display:inline-block;min-width:92px}
.cl{font-size:.85rem;color:var(--mut)}.cl:before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--mut);margin-right:6px}.cl.on:before{background:#2f9e5f}.empty{color:var(--mut)}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink);max-width:480px;width:calc(100% - 32px);padding:20px;max-height:90vh;overflow:auto}
dialog::backdrop{background:rgba(0,0,0,.5)}
dialog label{display:block;font-size:.85rem;margin:10px 0 3px;color:var(--mut)}
dialog input,dialog select,dialog textarea{width:100%;padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font-size:.95rem}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}.row{display:flex;gap:10px}.row>div{flex:1;min-width:0}
.acts{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.note{font-size:.8rem;color:var(--mut);margin-top:16px}
@media (max-width:900px){
 .app{grid-template-columns:1fr}
 .steps{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line)}
 .step{flex:0 0 100px;border-bottom:0;border-right:1px solid var(--line);padding:8px 4px}
 aside{border-left:0;border-top:1px solid var(--line)}
}
[hidden]{display:none!important}.authbox{max-width:380px;margin:40px auto;padding:20px}.authbox label{display:block;font-size:.85rem;margin:10px 0 3px;color:var(--mut)}.authbox input{width:100%;padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font-size:1rem}
</style>
</head>
<body>
<header>
 <h1><span class="lens" aria-hidden="true"></span>Pokédex Taxonómica</h1>
 <div id="top" hidden style="display:flex;align-items:center;gap:10px"><span class="sans cl on" id="who"></span><button id="out">Salir</button><button class="primary" id="add">+ Añadir especie</button></div>
</header>
<section id="auth" class="authbox"><h2 style="margin-top:0">Entra a tu colección</h2><label for="em">Correo</label><input id="em" type="email" autocomplete="email"><label for="pw">Contraseña (mínimo 6 caracteres)</label><input id="pw" type="password" autocomplete="current-password"><p class="note" id="aerr" role="alert"></p><div class="acts"><button id="signup">Crear cuenta</button><button class="primary" id="login">Entrar</button></div></section>
<div class="app" id="app" hidden>
 <nav class="steps" id="steps" aria-label="Nivel taxonómico"></nav>
 <main><p class="crumb" id="crumb"></p><div class="grid" id="grid"></div><p class="crumb" id="exbar" style="margin-top:24px">Exportar: <button id="exj">Copia completa (JSON con fotos)</button> <button id="exc">Tabla (CSV, sin fotos)</button></p></main>
 <aside id="detail"></aside>
</div>

<dialog id="dlg">
 <h2 style="margin-top:0">Añadir especie</h2>
 <label for="f-foto">Foto</label>
 <input type="file" id="f-foto" accept="image/*">
 
 <div class="g2" id="fields"></div>
 <label for="f-comun">Nombre común</label><input id="f-comun" placeholder="Jaguar">
 <label for="f-car">Características</label>
 <textarea id="f-car" rows="3" placeholder="Hábitat, tamaño, dieta, rasgos para reconocerla"></textarea>
 <p class="note" id="err" role="alert"></p>
 <div class="acts"><button id="cancel">Cancelar</button><button class="primary" id="save">Guardar especie</button></div>
</dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SB=supabase.createClient('https://amybwsnzxmfdvaomkopm.supabase.co','sb_publishable_DVidqeawdNUHxd46TWgfbg_xfDGda_z');
const LV=['dominio','reino','filo','clase','orden','familia','genero','especie'];
const LN=['Dominio','Reino','Filo o división','Clase','Orden','Familia','Género','Especie'];
const COL=['#4da3ff','#3fd6dc','#3fd99b','#5cd94f','#a9d94f','#e6d93f','#f0a04f','#d9884f'];
const EMO={Animalia:'🐾',Plantae:'🌿',Fungi:'🍄',Protista:'🔬',Monera:'🦠'};
const DOM=['Bacteria','Archaea','Eukarya'];
const REINOS={Bacteria:['Monera'],Archaea:['Monera'],Eukarya:['Animalia','Plantae','Fungi','Protista']};
let data=[],path=[],sel=null,uid=null;
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=id=>document.getElementById(id);
const sci=s=>s.genero+' '+s.especie;
const scoped=()=>data.filter(s=>path.every((v,i)=>s[LV[i]]===v));
const photo=(src,r)=>src?'<img src="'+esc(src)+'" alt="">':'<span aria-hidden="true">'+(EMO[r]||'🧬')+'</span>';
const fromRow=r=>{const o={id:r.id,comun:r.comun||'',car:r.caracteristicas||'',foto:r.foto||''};LV.forEach(k=>o[k]=r[k]);return o};
function fix(){if(sel&&!data.find(x=>x.id===sel))sel=null;while(path.length>2&&!scoped().length)path.pop()}
async function loadData(){
 const {data:rows,error}=await SB.from('especies').select('*').order('creado');
 if(error){alert('No se pudieron cargar tus especies: '+error.message);return}
 data=rows.map(fromRow);fix();render();
 if(!data.length)$('crumb').textContent='Aún no tienes especies. Toca "+ Añadir especie" para empezar.';
}
function render(){
 const d=path.length,cur=Math.min(d,7),sp=data.find(x=>x.id===sel);
 $('steps').innerHTML=LV.map((l,i)=>{
  const val=i<d?path[i]:(i===7&&sp?sci(sp):'—');
  return '<button class="step'+(i===cur?' on':'')+'" style="--c:'+COL[i]+'" data-i="'+i+'"'+(i>d?' disabled':'')+'><span class="lv">'+LN[i]+'</span><span class="val">'+esc(val)+'</span></button>';
 }).join('');
 $('crumb').textContent=(d?path.join(' › ')+' — ':'')+(d<7?'elige '+(LN[d]==='Filo o división'?'un filo o división':'un/a '+LN[d].toLowerCase()):'elige una especie');
 const items=scoped();let h='';
 if(d<7){
  let keys=d===0?DOM:d===1?(REINOS[path[0]]||[]):[...new Set(items.map(s=>s[LV[d]]))];
  h=keys.map(k=>{
   const g=items.filter(s=>s[LV[d]]===k),ph=g.find(s=>s.foto),r=d>=1?(d===1?k:path[1]):(g[0]&&g[0].reino);
   return '<button class="card" data-k="'+esc(k)+'"><div class="ph">'+photo(ph&&ph.foto,r)+'</div><div class="cap"><b>'+esc(k)+'</b><small>'+g.length+(g.length===1?' especie':' especies')+'</small></div></button>';
  }).join('')||'<p class="empty">Aún no hay nada aquí.</p>';
 }else{
  h=items.map(s=>'<button class="card'+(s.id===sel?' sel':'')+'" data-id="'+s.id+'"><div class="ph">'+photo(s.foto,s.reino)+'</div><div class="cap"><b>'+esc(s.comun||sci(s))+'</b><i>'+esc(sci(s))+'</i></div></button>').join('');
 }
 $('grid').innerHTML=h;
 $('detail').innerHTML=sp?'<div class="ph">'+photo(sp.foto,sp.reino)+'</div><h2>'+esc(sp.comun||sci(sp))+'</h2><p class="sci">'+esc(sci(sp))+'</p><ol class="lin">'+LV.slice(0,7).map((k,i)=>'<li style="--c:'+COL[i]+'"><span>'+LN[i]+'</span> '+esc(sp[k])+'</li>').join('')+'</ol><h3 style="margin:0 0 4px;font-size:1rem">Características</h3><p style="margin:0 0 16px">'+esc(sp.car||'Sin descripción todavía.')+'</p><button id="del">Eliminar</button>':'<p class="empty">Baja por los niveles hasta una especie para ver su ficha: foto, nombre común, nombre científico, clasificación completa y características.</p>';
}
$('steps').onclick=e=>{const b=e.target.closest('.step');if(!b||b.disabled)return;path=path.slice(0,+b.dataset.i);sel=null;render()};
$('grid').onclick=e=>{const c=e.target.closest('.card');if(!c)return;if(c.dataset.id)sel=c.dataset.id;else{path.push(c.dataset.k);sel=null}render()};

$('detail').onclick=async e=>{
 if(e.target.id!=='del'||!confirm('¿Eliminar esta especie?'))return;
 const id=sel,{error}=await SB.from('especies').delete().eq('id',id);
 if(error){alert('No se pudo eliminar: '+error.message);return}
 data=data.filter(s=>s.id!==id);sel=null;fix();render();
};
const PH={filo:'Chordata',clase:'Mammalia',orden:'Carnivora',familia:'Felidae',genero:'Panthera',especie:'onca'};
const dlg=$('dlg');
$('fields').innerHTML=LV.map((k,i)=>'<div><label for="f-'+k+'">'+LN[i]+'</label>'+(k==='dominio'?'<select id="f-dominio">'+DOM.map(x=>'<option>'+x+'</option>').join('')+'</select>':k==='reino'?'<select id="f-reino">'+['Animalia','Plantae','Fungi','Protista','Monera'].map(x=>'<option>'+x+'</option>').join('')+'</select>':'<input id="f-'+k+'" placeholder="'+PH[k]+'">')+'</div>').join('');
$('f-reino').onchange=()=>{const m=$('f-reino').value==='Monera';if(m&&$('f-dominio').value==='Eukarya')$('f-dominio').value='Bacteria';if(!m)$('f-dominio').value='Eukarya'};
$('add').onclick=()=>{
 $('err').textContent='';$('f-foto').value='';$('f-comun').value='';$('f-car').value='';
 LV.forEach((k,i)=>{$('f-'+k).value=path[i]||(i<2?$('f-'+k).options[0].value:'')});
 dlg.showModal();
};
$('cancel').onclick=()=>dlg.close();
function resize(file){return new Promise(res=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,420/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.72))};im.onerror=()=>res('');im.src=r.result};r.onerror=()=>res('');r.readAsDataURL(file)})}
$('save').onclick=async()=>{
 const rec={comun:$('f-comun').value.trim(),caracteristicas:$('f-car').value.trim(),foto:''};
 LV.forEach(k=>rec[k]=$('f-'+k).value.trim());
 const miss=LV.filter(k=>!rec[k]).map(k=>LN[LV.indexOf(k)].toLowerCase());
 if(miss.length){$('err').textContent='Falta: '+miss.join(', ')+'.';return}
 const f=$('f-foto').files[0];if(f)rec.foto=await resize(f);
 $('save').disabled=true;
 const {data:row,error}=await SB.from('especies').insert(rec).select().single();
 $('save').disabled=false;
 if(error){$('err').textContent='No se pudo guardar: '+error.message;return}
 const o=fromRow(row);data.push(o);path=LV.slice(0,7).map(k=>o[k]);sel=o.id;dlg.close();render();
};
function saveFile(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function exportData(kind){
 if(!data.length){alert('Aún no hay especies para exportar.');return}
 const d=new Date().toISOString().slice(0,10);
 if(kind==='json')return saveFile('pokedex-taxonomica-'+d+'.json',JSON.stringify(data,null,1),'application/json');
 const cols=LV.concat(['comun','car']),q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
 saveFile('pokedex-taxonomica-'+d+'.csv','\uFEFF'+[cols.map(q).join(',')].concat(data.map(r=>cols.map(c=>q(r[c])).join(','))).join('\r\n'),'text/csv');
}
$('exj').onclick=()=>exportData('json');$('exc').onclick=()=>exportData('csv');
async function auth(m){
 const email=$('em').value.trim(),password=$('pw').value;$('aerr').textContent='';
 const r=m==='in'?await SB.auth.signInWithPassword({email,password}):await SB.auth.signUp({email,password});
 if(r.error)$('aerr').textContent=r.error.message;
 else if(m==='up'&&!r.data.session)$('aerr').textContent='Cuenta creada. Revisa tu correo para confirmarla y luego entra.';
}
$('login').onclick=()=>auth('in');$('signup').onclick=()=>auth('up');$('out').onclick=()=>SB.auth.signOut();
SB.auth.onAuthStateChange((_e,sess)=>{
 const u=sess&&sess.user;
 $('auth').hidden=!!u;$('app').hidden=!u;$('top').hidden=!u;$('who').textContent=u?u.email:'';
 if(u&&u.id!==uid){uid=u.id;loadData()}
 if(!u){uid=null;data=[];path=[];sel=null}
});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
