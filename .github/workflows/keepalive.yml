# Mantiene activo el proyecto de Supabase (el plan gratuito lo pausa tras ~7 días sin actividad).
# Hace una consulta de solo lectura cada 3 días. Usa la clave publicable, que ya es pública en supabase.js.
name: Supabase keep-alive

on:
  schedule:
    - cron: '17 9 */3 * *'   # 09:17 UTC, cada 3 días
  workflow_dispatch:          # también se puede lanzar a mano desde la pestaña Actions

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Consulta a Supabase
        run: |
          curl --fail --silent --show-error --retry 3 --retry-delay 10 \
            -H "apikey: sb_publishable_DVidqeawdNUHxd46TWgfbg_xfDGda_z" \
            "https://amybwsnzxmfdvaomkopm.supabase.co/rest/v1/especies?select=id&limit=1"
          echo
